    proxies:
      - Final
      - NO_HK
    icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Google.png

  - name: Bahamut
    type: select
    proxies:
      - Final
      - HK
      - TW
      - DIRECT
